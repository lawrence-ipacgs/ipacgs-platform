[project]
name = "ipacgs-api"
version = "0.1.0"
description = "IPAC Governance Systems — API service. Milestone 1.1: tenant model, identity, master data, OPBOH."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "azure-identity>=1.19",
    "azure-keyvault-secrets>=4.9",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "bandit>=1.7",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends() is meant to be called in argument defaults —
# that's the framework's own documented pattern, not the bug bugbear assumes.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic migration files follow Alembic's own generated-script conventions
# (Union/Sequence from typing) — not worth fighting the tool that writes them.
"src/ipacgs/migrations/versions/*.py" = ["UP035", "UP007"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Session-scoped, matching core/db.py's module-level `engine` singleton and
# conftest.py's session-scoped `_schema` fixture. pytest-asyncio defaults to
# a fresh event loop per test function; a session-scoped asyncpg connection
# pool used across function-scoped loops fails with "attached to a
# different loop" / "Event loop is closed" once more than one test runs.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
