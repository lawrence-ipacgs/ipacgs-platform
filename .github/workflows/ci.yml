name: CI

# DEV-CICD-003 — build, lint, test and security-scan gates. Nothing in this
# workflow deploys anywhere; it's the "does this PR pass" gate, not the
# release pipeline (which doesn't exist yet — see infra/README.md).

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: services/api

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ipacgs_test
          POSTGRES_PASSWORD: ipacgs_test
          POSTGRES_DB: ipacgs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ipacgs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ipacgs_test:ipacgs_test@localhost:5432/ipacgs_test
      AZURE_TENANT_ID: "00000000-0000-0000-0000-000000000000"
      ENTRA_API_APP_ID: "00000000-0000-0000-0000-000000000000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - name: Apply migrations to the test database
        run: alembic upgrade head
      - name: Run tests
        run: pytest -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - name: Static security scan (bandit)
        run: bandit -r src -ll
      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --strict

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        # Confirms the image builds; does not push. Pushing to ACR needs
        # OIDC federation set up between this repo and the registry created
        # in infra/bicep/modules/container-registry.bicep — a deliberate
        # follow-up once there's a real environment to push to, not before.
        run: docker build -t ipacgs-api:ci .

  bicep-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/bicep
    steps:
      - uses: actions/checkout@v4
      - name: Compile every Bicep file (catches syntax errors, no Azure login needed)
        run: |
          for f in main.bicep modules/*.bicep; do
            echo "Building $f"
            az bicep build --file "$f" --outfile /dev/null
          done
