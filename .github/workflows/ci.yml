name: CI

# DEV-CICD-003 — build, lint, test and security-scan gates. Nothing in this
# workflow deploys anywhere; it's the "does this PR pass" gate. The release
# pipeline is release-dev.yml, which runs after a commit lands on main —
# by which point these checks already passed as a branch-protection
# requirement on the PR, so it doesn't re-run them.

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: services/api

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ipacgs_test
          POSTGRES_PASSWORD: ipacgs_test
          POSTGRES_DB: ipacgs_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ipacgs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ipacgs_test:ipacgs_test@localhost:5432/ipacgs_test
      AZURE_TENANT_ID: "00000000-0000-0000-0000-000000000000"
      ENTRA_API_APP_ID: "00000000-0000-0000-0000-000000000000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - name: Apply migrations to the test database
        run: alembic upgrade head
      - name: Run tests
        run: pytest -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -e ".[dev]"
      - name: Static security scan (bandit)
        run: bandit -r src -ll
      - name: Dependency vulnerability scan (pip-audit)
        # --skip-editable didn't work here: --strict treats "skipped
        # because editable" the same as "could not be audited" and still
        # fails. Auditing a frozen requirements list instead means our own
        # editable package never appears in what pip-audit is asked to
        # check in the first place — nothing to skip, nothing to fail on.
        run: |
          pip install pip-audit
          pip freeze --exclude-editable > /tmp/requirements-audit.txt
          pip-audit --strict -r /tmp/requirements-audit.txt

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        # Fast PR-time smoke check — confirms the image builds, does not
        # push anywhere. release-dev.yml does the real build-and-push (via
        # az acr build, inside ACR) once a commit reaches main.
        run: docker build -t ipacgs-api:ci .

  bicep-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/bicep
    steps:
      - uses: actions/checkout@v4
      - name: Compile every Bicep file (catches syntax errors, no Azure login needed)
        run: |
          for f in main.bicep modules/*.bicep; do
            echo "Building $f"
            az bicep build --file "$f" --outfile /dev/null
          done
